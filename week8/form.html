<!DOCTYPE html>
<html>

<head>
    <title>Registration Form</title>
</head>

<body>

    <h2>Registration Form</h2>

    <form action="#">
        <label for="fname">First Name*:</label><br>
        <input type="text" id="fname" name="fname" required><br><br>

        <label for="lname">Last Name*:</label><br>
        <input type="text" id="lname" name="lname" required><br><br>

        <label for="dob">Date of Birth*:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="email">Email Address*:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="homepage">Homepage URL:</label><br>
        <input type="url" id="homepage" name="homepage"><br><br>

        <label for="color">Favourite Colors:</label><br>
        <input type="color" id="color" name="color"><br><br>

        <label for="bio">Bio / Self Introduction:</label><br>
        <textarea id="bio" name="bio" rows="4" cols="30"></textarea><br><br>

        <input type="submit" value="Submit">
    </form>

</body>

</html>
